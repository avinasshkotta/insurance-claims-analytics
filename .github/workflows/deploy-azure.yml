name: deploy-azure

# Push to main -> build image -> publish to GHCR -> update the Container App.
# Authentication uses GitHub OIDC, so there is no long-lived Azure secret in the repo.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: deploy-azure
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/claims-console
  RESOURCE_GROUP: rg-claims-demo
  CONTAINER_APP: claims-console

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: echo "image=${IMAGE}:${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for OIDC
      contents: read
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the Container App at the new image
        uses: azure/cli@v2
        with:
          inlineScript: |
            az containerapp update \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --image "${{ needs.build.outputs.image }}"

      - name: Smoke test
        uses: azure/cli@v2
        with:
          inlineScript: |
            FQDN=$(az containerapp show \
              --name "$CONTAINER_APP" \
              --resource-group "$RESOURCE_GROUP" \
              --query properties.configuration.ingress.fqdn -o tsv)
            echo "https://$FQDN"
            for i in $(seq 1 20); do
              if curl -fsS "https://$FQDN/api/health" > /dev/null; then
                echo "health OK"; exit 0
              fi
              sleep 6
            done
            echo "health check did not pass within 2 minutes" >&2
            exit 1
