# Local demo: app + Caddy (automatic HTTPS for a DuckDNS name).
#
#   cd deploy/local-demo
#   copy .env.example .env      # DOMAIN + DUCKDNS_TOKEN
#   docker compose up -d --build
#
# Requires ports 80 and 443 forwarded to this machine.

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    env_file:
      - ../../.env
    environment:
      # Public-demo guards always win over local .env values.
      DEMO_MODE: "1"
      DEMO_RPM: "20"
      DEMO_DAILY_USD: "1.00"
      DEMO_ALLOW_UPLOADS: "0"
      MAX_OUTPUT_TOKENS: "500"
    expose:
      - "8000"
    ports:
      # Local debugging only; the public path is through Caddy.
      - "127.0.0.1:8010:8000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
