[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "claims-assistant"
version = "0.1.0"
description = "Insurance claims analytics — four-layer claims assistant (LLM / RAG / Agent / MCP)"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.40.0",
    "mcp>=1.0.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "fpdf2>=2.7.0",
    "pymupdf>=1.24",
    "pillow>=10.0",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn==1.7.2",
    "joblib>=1.3",
    "shap>=0.44",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
claims-assistant = "claims_assistant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
